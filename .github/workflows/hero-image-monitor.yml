name: Hero Image Monitor

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/blog-images/**"
      - "public/opengraph-images/**"
      - "scripts/monitor-hero-images.mjs"

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - env:
          SITE_BASE: https://weddings.io
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: node scripts/monitor-hero-images.mjs
