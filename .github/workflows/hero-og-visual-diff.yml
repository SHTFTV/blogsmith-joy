name: Hero + OG Visual Diff (staging vs prod)

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/lib/blogPosts.ts"
      - "src/routes/blog.$slug.tsx"
      - "src/components/BlogCard.tsx"
      - "scripts/hero-og-visual-diff.mjs"

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun add -d playwright pixelmatch pngjs
      - run: bunx playwright install --with-deps chromium
      - env:
          STAGING_URL: https://id-preview--f66519c0-b737-42fa-8d08-b4adf7e257fc.lovable.app
          PROD_URL: https://weddings.io
          STAGING_PROD_THRESHOLD: "0.03"
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: node scripts/hero-og-visual-diff.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-og-visual-diff
          path: tests/visual-regression/hero-og/
