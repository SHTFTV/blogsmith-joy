name: Pricing snapshots — auto PR
# Runs after the pricing-rows-a11y workflow finishes. If any browser had
# missing baselines and uploaded a "*-baselines" artifact, download all of
# them and open a single PR adding the new snapshot files.
on:
  workflow_run:
    workflows: ["Pricing rows a11y — cross-browser"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

# Only one auto-PR run per source branch at a time. Newer runs cancel older
# in-flight ones so we never race on the same snapshots branch/PR.
concurrency:
  group: pricing-snapshots-pr-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  open-baseline-pr:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}
    env:
      SNAP_DIR: tests/e2e/pricing-rows-a11y.spec.ts-snapshots
      PR_BRANCH: ci/pricing-snapshots-${{ github.event.workflow_run.head_branch }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Marker used to find & update the same PR comment across reruns.
      COMMENT_MARKER: '<!-- pricing-snapshots-missing-files -->'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      # List candidate baseline artifacts from the triggering run BEFORE
      # downloading, so we can fail fast with a clear message when the
      # pricing workflow didn't upload anything (or uploaded empty ones).
      - name: Preflight — inventory baseline artifacts
        id: inventory
        run: |
          set -euo pipefail
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/${{ github.event.workflow_run.id }}/artifacts" \
            --paginate > /tmp/artifacts.json
          jq -r '.artifacts[] | select(.name | test("^pricing-rows-a11y-.*-baselines$")) | "\(.name)\t\(.size_in_bytes)\t\(.expired)"' \
            /tmp/artifacts.json > /tmp/baseline-artifacts.tsv || true
          count=$(wc -l < /tmp/baseline-artifacts.tsv | tr -d ' ')
          echo "found=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" = "0" ]; then
            echo "No *-baselines artifacts were uploaded by the pricing workflow — nothing to seed."
            echo "has_baselines=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Found $count baseline artifact(s):"
          cat /tmp/baseline-artifacts.tsv
          bad=0
          while IFS=$'\t' read -r name size expired; do
            if [ "$expired" = "true" ]; then
              echo "::error::Baseline artifact '$name' has expired."
              bad=1
            elif [ "${size:-0}" -eq 0 ]; then
              echo "::error::Baseline artifact '$name' is empty (0 bytes)."
              bad=1
            fi
          done < /tmp/baseline-artifacts.tsv
          if [ "$bad" -ne 0 ]; then
            echo "::error::One or more *-baselines artifacts are missing or empty — aborting before copy."
            exit 1
          fi
          echo "has_baselines=true" >> "$GITHUB_OUTPUT"

      - name: Download baseline artifacts
        if: steps.inventory.outputs.has_baselines == 'true'
        uses: actions/download-artifact@v4
        with:
          path: /tmp/baselines
          pattern: pricing-rows-a11y-*-baselines
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: false

      - name: Count downloaded PNGs
        id: check
        if: steps.inventory.outputs.has_baselines == 'true'
        run: |
          set -euo pipefail
          count=$(find /tmp/baselines -type f -name '*.png' | wc -l | tr -d ' ')
          if [ "$count" = "0" ]; then
            echo "::error::Downloaded *-baselines artifacts contain no PNG files."
            exit 1
          fi
          echo "Found $count PNG baseline(s) across artifacts."
          echo "png_count=$count" >> "$GITHUB_OUTPUT"

      - name: Skip if PR already open
        id: existing
        if: steps.inventory.outputs.has_baselines == 'true'
        run: |
          set -euo pipefail
          existing=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$PR_BRANCH" \
            --state open \
            --json number,url \
            --jq '.[0] // empty')
          if [ -n "$existing" ]; then
            url=$(echo "$existing" | jq -r .url)
            num=$(echo "$existing" | jq -r .number)
            echo "::notice::Open snapshots PR already exists (#$num) — $url"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "pr_url=$url" >> "$GITHUB_OUTPUT"
            echo "pr_number=$num" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy baselines into repo
        id: copy
        if: steps.inventory.outputs.has_baselines == 'true' && steps.existing.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$SNAP_DIR"
          expected=$(find /tmp/baselines -type f -name '*.png' | sort)
          expected_count=$(echo "$expected" | grep -c . || true)
          for src in $expected; do
            cp -v "$src" "$SNAP_DIR/"
          done
          echo "expected_count=$expected_count" >> "$GITHUB_OUTPUT"

      - name: Verify all baselines copied
        if: steps.inventory.outputs.has_baselines == 'true' && steps.existing.outputs.skip != 'true'
        run: |
          set -euo pipefail
          missing=()
          while IFS= read -r src; do
            base=$(basename "$src")
            if [ ! -f "$SNAP_DIR/$base" ]; then
              missing+=("$base")
            fi
          done < <(find /tmp/baselines -type f -name '*.png')
          copied=$(find "$SNAP_DIR" -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')
          echo "Snapshot dir now has $copied PNG(s)."
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::${#missing[@]} baseline(s) failed to copy into $SNAP_DIR:"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi
          echo "All ${{ steps.copy.outputs.expected_count }} baseline(s) verified in $SNAP_DIR."

      - name: Build missing-files list for PR body
        id: manifest
        if: steps.inventory.outputs.has_baselines == 'true'
        run: |
          set -euo pipefail
          out=/tmp/missing-all.txt
          : > "$out"
          for f in $(find /tmp/baselines -type f -name 'missing-*.txt' | sort); do
            browser=$(basename "$f" .txt | sed 's/^missing-//')
            echo "### $browser" >> "$out"
            echo '```' >> "$out"
            grep -v '^[[:space:]]*$' "$f" >> "$out" || true
            echo '```' >> "$out"
            echo "" >> "$out"
          done
          if [ ! -s "$out" ]; then
            echo "_No per-browser manifest uploaded — see workflow logs for details._" > "$out"
          fi
          {
            echo 'body<<EOF'
            cat "$out"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        id: cpr
        if: steps.inventory.outputs.has_baselines == 'true' && steps.existing.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.PR_BRANCH }}
          base: ${{ github.event.workflow_run.head_branch }}
          commit-message: "test(pricing): seed pricing-rows-a11y snapshot baselines"
          title: "test(pricing): seed pricing-rows-a11y snapshot baselines"
          body: |
            Auto-generated by `.github/workflows/pricing-snapshots-pr.yml`.

            The `pricing-rows-a11y` workflow (run
            [#${{ github.event.workflow_run.id }}](${{ github.event.workflow_run.html_url }}))
            detected missing Playwright snapshot baselines and re-ran with
            `--update-snapshots`. This PR adds the ${{ steps.check.outputs.png_count }} generated
            PNG(s) so future runs of the workflow can pass without seeding.

            ## Missing baseline files (by browser)

            ${{ steps.manifest.outputs.body }}

            Review the screenshots and merge if they look correct.
          labels: |
            ci
            snapshots
            automated
          add-paths: |
            tests/e2e/pricing-rows-a11y.spec.ts-snapshots/**

      # Update-or-create a single marker comment on the target PR (whether
      # newly created OR the existing open one) so reruns don't spam.
      - name: Upsert missing-files PR comment
        id: comment
        if: steps.inventory.outputs.has_baselines == 'true' && (steps.cpr.outputs.pull-request-number != '' || steps.existing.outputs.pr_number != '')
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.cpr.outputs.pull-request-number || steps.existing.outputs.pr_number }}"
          {
            echo "$COMMENT_MARKER"
            echo "**Missing baseline files (from preflight)**"
            echo ""
            echo "_Last updated by workflow run [#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) — pricing run [#${{ github.event.workflow_run.id }}](${{ github.event.workflow_run.html_url }})._"
            echo ""
            cat /tmp/missing-all.txt
          } > /tmp/comment.md

          existing_id=$(gh api \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --paginate \
            --jq "[.[] | select(.body | contains(\"$COMMENT_MARKER\"))][0].id // empty")

          if [ -n "$existing_id" ]; then
            echo "Updating existing marker comment $existing_id on PR #$PR_NUMBER"
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$existing_id" \
              -F body=@/tmp/comment.md >/dev/null
            echo "comment_action=updated" >> "$GITHUB_OUTPUT"
          else
            echo "Posting new marker comment on PR #$PR_NUMBER"
            gh pr comment "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file /tmp/comment.md
            echo "comment_action=created" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## Pricing snapshots auto-PR"
            if [ "${{ steps.inventory.outputs.has_baselines }}" != "true" ]; then
              echo "- No baseline artifacts to process."
            else
              echo "- Baseline artifacts found: ${{ steps.inventory.outputs.found }}"
              echo "- PNG baselines downloaded: ${{ steps.check.outputs.png_count }}"
              if [ "${{ steps.existing.outputs.skip }}" = "true" ]; then
                echo "- **Skipped new PR** — existing open PR **#${{ steps.existing.outputs.pr_number }}**: ${{ steps.existing.outputs.pr_url }}"
              elif [ -n "${{ steps.cpr.outputs.pull-request-number }}" ]; then
                echo "- **PR ${{ steps.cpr.outputs.pull-request-operation }}** — **#${{ steps.cpr.outputs.pull-request-number }}**: ${{ steps.cpr.outputs.pull-request-url }}"
                echo "- Baselines copied: ${{ steps.copy.outputs.expected_count }}"
              fi
              if [ -n "${{ steps.comment.outputs.comment_action }}" ]; then
                echo "- Missing-files comment: ${{ steps.comment.outputs.comment_action }}"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
