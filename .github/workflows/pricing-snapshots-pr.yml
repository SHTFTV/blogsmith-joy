name: Pricing snapshots — auto PR
# Runs after the pricing-rows-a11y workflow finishes. If any browser had
# missing baselines and uploaded a "*-baselines" artifact, download all of
# them and open a single PR adding the new snapshot files.
on:
  workflow_run:
    workflows: ["Pricing rows a11y — cross-browser"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  open-baseline-pr:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Download baseline artifacts (if any)
        id: download
        uses: actions/download-artifact@v4
        with:
          path: /tmp/baselines
          pattern: pricing-rows-a11y-*-baselines
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: false
        continue-on-error: true

      - name: Check for baseline files
        id: check
        run: |
          if [ ! -d /tmp/baselines ] || [ -z "$(ls -A /tmp/baselines 2>/dev/null)" ]; then
            echo "No baseline artifacts uploaded — nothing to seed."
            echo "has_baselines=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "has_baselines=true" >> $GITHUB_OUTPUT
          find /tmp/baselines -type f -name '*.png' | sort

      - name: Copy baselines into repo
        if: steps.check.outputs.has_baselines == 'true'
        run: |
          set -euo pipefail
          dest="tests/e2e/pricing-rows-a11y.spec.ts-snapshots"
          mkdir -p "$dest"
          # Each artifact expands to /tmp/baselines/<artifact-name>/... with
          # the snapshot dir preserved. Copy every .png into $dest.
          find /tmp/baselines -type f -name '*.png' -exec cp -v {} "$dest"/ \;
          echo "---"
          ls -la "$dest" | head -50

      - name: Create Pull Request
        if: steps.check.outputs.has_baselines == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ci/pricing-snapshots-${{ github.event.workflow_run.head_branch }}
          base: ${{ github.event.workflow_run.head_branch }}
          commit-message: "test(pricing): seed pricing-rows-a11y snapshot baselines"
          title: "test(pricing): seed pricing-rows-a11y snapshot baselines"
          body: |
            Auto-generated by `.github/workflows/pricing-snapshots-pr.yml`.

            The `pricing-rows-a11y` workflow (run
            [#${{ github.event.workflow_run.id }}](${{ github.event.workflow_run.html_url }}))
            detected missing Playwright snapshot baselines and re-ran with
            `--update-snapshots`. This PR adds the generated PNGs so future
            runs of the workflow can pass without seeding.

            Review the screenshots below and merge if they look correct.
          labels: |
            ci
            snapshots
            automated
          add-paths: |
            tests/e2e/pricing-rows-a11y.spec.ts-snapshots/**
