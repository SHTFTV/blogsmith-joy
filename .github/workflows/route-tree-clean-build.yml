name: route-tree-clean-build

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/routes/**'
      - 'src/router.tsx'
      - 'scripts/validate-route-tree.mjs'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

jobs:
  clean-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Clear caches (prevent stale routeTree.gen.ts)
        run: |
          rm -rf node_modules .vite dist .output .wrangler
          rm -f src/routeTree.gen.ts

      - name: Install (fresh)
        run: bun install --frozen-lockfile

      - name: Validate route tree (strict — must regenerate cleanly)
        run: bun run validate:route-tree

      - name: Build (dev)
        run: bun run build:dev
        env:
          SKIP_MANIFESTO_LINKS: '1'

      - name: Build (prod)
        run: bun run build
        env:
          SKIP_MANIFESTO_LINKS: '1'

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: route-tree-diagnostics
          path: |
            src/routeTree.gen.ts
            .artifacts/**
          if-no-files-found: ignore
