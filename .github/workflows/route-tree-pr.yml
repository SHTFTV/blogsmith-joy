name: Route Tree Validation (PR)

on:
  pull_request:
    paths:
      - "src/routes/**"
      - "src/router.tsx"
      - "src/routeTree.gen.ts"
      - "scripts/validate-route-tree.mjs"
      - "package.json"

jobs:
  validate-route-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate route tree (fail fast)
        run: node scripts/validate-route-tree.mjs
