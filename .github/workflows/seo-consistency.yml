name: SEO consistency
on:
  push:
    branches: [main]
  pull_request:
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@v2
      - name: Regenerate feeds (sitemap.xml, sitemap-images.xml, rss.xml)
        run: bun scripts/regen-feeds.mjs
      - name: Blog SEO — unique titles / descriptions / focus keywords
        run: node scripts/validate-blog-post-seo.mjs
      - name: Blog canonicals — self-reference https://weddings.io/blog/<slug>/
        run: node scripts/validate-blog-canonicals.mjs
      - name: Blog feeds — sitemap.xml + sitemap-images.xml + rss.xml coverage
        run: node scripts/validate-blog-feed-coverage.mjs
      - name: Blog og:image URLs — absolute + HTTP 200 image/*
        run: node scripts/validate-blog-og-http.mjs
      - name: SEO CI gate (JSON-LD, share previews, schema IDs)
        run: node scripts/ci-seo-check.mjs
      - name: Upload homepage JSON-LD snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-snapshots
          path: seo-snapshots/
