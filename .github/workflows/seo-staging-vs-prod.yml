name: SEO Staging vs Production Diff

on:
  pull_request:
    paths:
      - "src/lib/blogPosts.ts"
      - "src/lib/blogOgCards.json"
      - "src/lib/blogImageManifest.json"
      - "src/routes/blog.**"
      - "scripts/generate-og-cards.mjs"
      - "scripts/diff-staging-vs-prod-meta.mjs"
      - ".github/workflows/seo-staging-vs-prod.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pull-requests: write

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Diff staging vs production
        env:
          TOLERATE_STALE: "1"
          STAGING_BASE: https://blogsmith-joy.lovable.app
          PROD_BASE: https://weddings.io
        run: node scripts/diff-staging-vs-prod-meta.mjs
      - name: Playwright OG image smoke
        env:
          STAGING_BASE: https://blogsmith-joy.lovable.app
          PROD_BASE: https://weddings.io
        run: |
          bunx playwright install --with-deps chromium
          bunx playwright test blog-og-image-smoke --reporter=line
        continue-on-error: true
      - id: upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-staging-vs-prod
          path: tests/seo/staging-vs-prod-diff.json
          if-no-files-found: warn
      - name: Post PR comment
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: node scripts/post-diff-pr-comment.mjs
