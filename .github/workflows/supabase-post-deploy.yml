name: supabase-post-deploy-security
on:
  workflow_run:
    workflows: ["SEO consistency"]
    types: [completed]
  workflow_dispatch:

jobs:
  live-scan:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Live Supabase linter scan (blocks next publish on new WARN)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/scan-supabase-live-security.mjs
