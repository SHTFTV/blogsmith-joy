name: supabase-security
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "scripts/lint-supabase-security.mjs"
      - ".github/workflows/supabase-security.yml"

jobs:
  lint-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint Supabase migrations for common policy/security regressions
        run: node scripts/lint-supabase-security.mjs
