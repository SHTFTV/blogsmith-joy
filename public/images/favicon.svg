<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FF8C00"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B00"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FFF4E0"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#0A0A0A"/>
  
  <!-- Diya base (lamp) -->
  <ellipse cx="256" cy="340" rx="120" ry="35" fill="url(#gold)"/>
  <path d="M136 340 Q136 280 180 260 L332 260 Q376 280 376 340 Z" fill="url(#gold)"/>
  
  <!-- Flame -->
  <path d="M256 100 
           Q280 140 280 180 
           Q280 220 256 240 
           Q232 220 232 180 
           Q232 140 256 100 Z" 
        fill="url(#flame)"/>
  
  <!-- Inner flame glow -->
  <ellipse cx="256" cy="180" rx="15" ry="30" fill="#FFFFFF" opacity="0.8"/>
  
  <!-- Wick -->
  <rect x="252" y="240" width="8" height="25" fill="#8B4513"/>
</svg>
