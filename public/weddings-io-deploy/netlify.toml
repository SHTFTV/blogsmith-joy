[build]
  command = "echo 'Static site ready'"
  publish = "."

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"

[context.production]
  environment = { NODE_VERSION = "18.0.0" }
